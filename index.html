<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Testownik</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Prevent flash of wrong theme or dark mode by applying attributes synchronously
      (function() {
        try {
          var storedDark = localStorage.getItem('testownik_dark');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = storedDark !== null ? storedDark === 'true' : prefersDark;
          if (dark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var storedTheme = localStorage.getItem('testownik_theme');
          if (storedTheme && storedTheme !== 'blue') {
            document.documentElement.setAttribute('data-theme', storedTheme);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
