<!doctype html>
<html lang="pl" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co stun: turn: http://localhost:* ws://localhost:*" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta name="format-detection" content="telephone=no" />
    <title>Testownik</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Prevent flash of wrong theme, language, or dark mode by applying attributes synchronously
      (function() {
        try {
          var storedLang = localStorage.getItem('testownik_language') || 'pl';
          document.documentElement.lang = storedLang;

          var storedDark = localStorage.getItem('testownik_dark');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = storedDark !== null ? storedDark === 'true' : prefersDark;
          if (dark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var storedTheme = localStorage.getItem('testownik_theme');
          if (storedTheme && storedTheme !== 'blue') {
            document.documentElement.setAttribute('data-theme', storedTheme);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
